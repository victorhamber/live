# EasyPanel: crie um serviço Compose apontando para este arquivo,
# ou use um serviço App com o Dockerfile da raiz.
# O volume live-data mantém o SQLite entre deploys.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/prod.db
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - live-data:/app/data

volumes:
  live-data:
